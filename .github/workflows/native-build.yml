name: Build memis.so (nativo FFI)

on:
  workflow_dispatch:
  push:
    paths:
      - "native/memis.c"
      - "native/build.sh"
      - ".github/workflows/memis-build.yml"

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Compilar
        run: sh ./native/build.sh

      - name: Verificar que exporta los simbolos
        run: |
          nm -D --defined-only native/lib/memis.so | grep -q "msi_version" || (echo "simbolo msi_version no encontrado" && exit 1)
          echo "Simbolos OK"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: memis-linux-x86_64
          path: native/lib/memis.so

  build-linux-arm64:
    name: Linux arm64 (Cobalt 100)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar toolchain cross aarch64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Compilar (cross aarch64)
        run: sh ./native/build.sh cross-aarch64

      - name: Verificar que exporta los simbolos
        run: |
          aarch64-linux-gnu-nm -D --defined-only native/lib/memis-linux-aarch64.so | grep -q "msi_version" || (echo "simbolo msi_version no encontrado" && exit 1)
          echo "Simbolos OK"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: memis-linux-aarch64
          path: native/lib/memis-linux-aarch64.so

  build-android:
    name: Android arm64-v8a + armeabi-v7a
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Descargar Android NDK (r27)
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r27d" >> $GITHUB_ENV

      - name: Compilar (android arm64-v8a)
        run: sh ./native/build.sh android

      - name: Compilar (android armeabi-v7a)
        run: sh ./native/build.sh android-arm32

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: memis-android
          path: |
            native/lib/memis-android-arm64-v8a.so
            native/lib/memis-android-armeabi-v7a.so

  release:
    name: Publicar en la release
    needs: [build-linux-x86_64, build-linux-arm64, build-android]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Adjuntar a la ultima release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd dist
          mv -f memis.so memis-linux-x86_64.so 2>/dev/null || true
          TAG=$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)
          RELEASE_ID=$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .id)
          for f in memis-linux-x86_64.so memis-linux-aarch64.so memis-android-arm64-v8a.so memis-android-armeabi-v7a.so; do
            if [ -f "$f" ]; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
                -F "name=$f" -F "data=@$f" >/dev/null && echo "Adjuntado $f a $TAG" || echo "$f ya existe en la release"
            fi
          done

